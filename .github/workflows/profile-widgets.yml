name: Refresh profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-widgets.yml'
      - '.github/scripts/render-activity.py'

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate overview — dark
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          core_version: '2.2.0'
          fail_on_error: 'true'
          options: username=localmiracle&custom_title=GitHub%20overview&hide_rank=true&hide=stars&show_icons=true&hide_border=true&bg_color=0d1117&title_color=6cb6c2&icon_color=6cb6c2&text_color=8b949e&text_bold=false&disable_animations=true&card_width=400&line_height=27&border_radius=12
          path: assets/widgets/overview-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate overview — light
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          core_version: '2.2.0'
          fail_on_error: 'true'
          options: username=localmiracle&custom_title=GitHub%20overview&hide_rank=true&hide=stars&show_icons=true&hide_border=true&bg_color=ffffff&title_color=2b7f8b&icon_color=2b7f8b&text_color=656d76&text_bold=false&disable_animations=true&card_width=400&line_height=27&border_radius=12
          path: assets/widgets/overview-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak — dark
        uses: DenverCoder1/github-readme-streak-stats@70dd50f921097927dc8314ac33a04b010a09924d
        with:
          options: user=localmiracle&hide_border=true&background=0d1117&ring=6cb6c2&fire=transparent&currStreakNum=e6edf3&sideNums=e6edf3&currStreakLabel=6cb6c2&sideLabels=8b949e&dates=8b949e&stroke=21262d&border_radius=12&card_width=400&card_height=195&locale=en&timezone=Europe%2FTallinn&disable_animations=true
          path: assets/widgets/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak — light
        uses: DenverCoder1/github-readme-streak-stats@70dd50f921097927dc8314ac33a04b010a09924d
        with:
          options: user=localmiracle&hide_border=true&background=ffffff&ring=2b7f8b&fire=transparent&currStreakNum=24292f&sideNums=24292f&currStreakLabel=2b7f8b&sideLabels=656d76&dates=656d76&stroke=d8dee4&border_radius=12&card_width=400&card_height=195&locale=en&timezone=Europe%2FTallinn&disable_animations=true
          path: assets/widgets/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render activity from GitHub and validate all widgets
        run: python3 .github/scripts/render-activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish valid widgets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/widgets/*.svg assets/widgets/activity.json
          if git diff --cached --quiet; then
            echo 'Widgets are unchanged.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh GitHub widgets [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
